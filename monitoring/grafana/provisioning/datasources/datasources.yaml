apiVersion: 1
datasources:
- name: Prometheus
  uid: delivery-prometheus
  type: prometheus
  access: proxy
  url: http://prometheus:9090
  isDefault: true
- name: Loki
  uid: delivery-loki
  type: loki
  access: proxy
  url: http://loki:3100
  jsonData:
    derivedFields:
    - name: TraceID
      matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
      datasourceUid: delivery-tempo
      url: $$${__value.raw}
- name: Tempo
  uid: delivery-tempo
  type: tempo
  access: proxy
  url: http://tempo:3200
