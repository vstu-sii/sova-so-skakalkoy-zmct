    "/v1/ai/extractions": {
      "post": {
        "operationId": "extractEvent",
        "summary": "Extract a new draft",
        "description": "Creates draft v1 and proposal; no publication. Unknown facts return 200 with blocking issues/questions. reference_date is explicit. At most 60s overall deadline; model unavailable can return manual draft.",
        "tags": [
          "AI"
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            },
            "description": "Owner-scoped exact operation retry key, retained 24h. Same key/path/body returns same resource result with current request_id and no new model call; changed body returns 409. Reserve key atomically before provider call."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ExtractionRequest"
              },
              "example": {
                "text": "15 ноября 2026 в 19:00 обсуждаем тревогу у подростков. Пространство «Точка», Пушкина 12. 2500 рублей, для своих 2000. Запись в личные сообщения.",
                "reference_date": "2026-10-14",
                "timezone": "Europe/Moscow"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success; may contain needs_clarification/manual status, see schema.",
