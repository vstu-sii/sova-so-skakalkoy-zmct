    "/v1/events/{event_id}/confirm": {
      "post": {
        "operationId": "confirmCandidate",
        "summary": "Confirm a reviewed candidate",
        "description": "No model call. Check owner, candidate/event relation, expiry, candidate.base_version and expected_version against stored version, and absence of blocking issues. Atomically commit and increment version; invalidate older content. Unclear candidate returns 422. Confirmation uses same validation gates for initial draft and patches.",
        "tags": [
          "AI"
        ],
        "parameters": [
          {
            "name": "event_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            },
            "description": "Owner-scoped exact operation retry key, retained 24h. Same key/path/body returns same resource result with current request_id and no new model call; changed body returns 409. Reserve key atomically before provider call."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ConfirmRequest"
              },
              "example": {
                "candidate_id": "11111111-1111-4111-8111-111111111111",
                "expected_version": 2
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success; may contain needs_clarification/manual status, see schema.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventRecord"
