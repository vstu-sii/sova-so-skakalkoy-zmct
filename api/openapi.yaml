    "/v1/events/{event_id}/ai/generations": {
      "post": {
        "operationId": "generateContent",
        "summary": "Generate drafts from a confirmed version",
        "description": "Require confirmed non-blocking event and exact version. Reject stale version with 409. Read a versioned snapshot; if current version changes during generation, discard output and return 409. Return all requested platforms or error, never partial success. Budget reservations shared across calls/retries; server may return economy/template mode. Human reviews all texts.",
        "tags": [
          "AI"
        ],
        "parameters": [
          {
            "name": "event_id",
            "in": "path",
            "required": true,
            "schema": {
