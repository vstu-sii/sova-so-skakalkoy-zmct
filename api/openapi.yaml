              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExtractionResponse"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "event_id": "11111111-1111-4111-8111-111111111111",
                  "event_version": 1,
                  "mode": "standard",
                  "candidate": {
                    "candidate_id": "11111111-1111-4111-8111-111111111111",
                    "base_version": 1,
                    "event": {
                      "title": "Встреча о тревоге у подростков",
                      "description": "Обсудим тревогу у подростков.",
                      "date_start": "2026-11-15",
                      "date_end": null,
                      "time_start": "19:00",
                      "venue": "Пространство «Точка», Пушкина 12",
                      "price": 2500,
                      "price_discount": 2000,
                      "registration": "Запись в личные сообщения эксперта"
                    },
                    "changes": [],
                    "issues": [],
                    "status": "awaiting_confirmation"
                  },
                  "usage": {
                    "input_tokens": 1200,
                    "output_tokens": 350,
