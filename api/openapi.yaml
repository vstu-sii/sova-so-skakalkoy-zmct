                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "code": "UNAUTHENTICATED",
                  "message": "Unauthenticated",
                  "issues": [],
                  "retryable": false
                }
              }
            }
          },
          "404": {
            "description": "Event/candidate not found or not owned by caller",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "code": "NOT_FOUND",
                  "message": "Event/candidate not found or not owned by caller",
                  "issues": [],
                  "retryable": false
                }
              }
            }
          },
          "409": {
            "description": "Version mismatch, candidate expired or idempotency conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "code": "CONFLICT",
                  "message": "Version mismatch, candidate expired or idempotency conflict",
                  "issues": [],
                  "retryable": false
                }
              }
            }
          },
          "413": {
            "description": "Input too long",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "code": "PAYLOAD_TOO_LARGE",
                  "message": "Input too long",
                  "issues": [],
                  "retryable": false
                }
              }
            }
          },
          "422": {
            "description": "Request or card cannot be processed/confirmed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "code": "VALIDATION_ERROR",
                  "message": "Request or card cannot be processed/confirmed",
                  "issues": [],
                  "retryable": false
                }
              }
            }
          },
          "429": {
            "description": "Rate limit or budget exceeded; no unreserved model call",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "code": "BUDGET_EXCEEDED",
                  "message": "Rate limit or budget exceeded; no unreserved model call",
                  "issues": [],
                  "retryable": false
                }
              }
            },
            "headers": {
              "Retry-After": {
                "description": "Seconds until retry where applicable; billing exhaustion may need user action.",
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          },
          "502": {
            "description": "Model refusal, invalid or truncated response after bounded attempts",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "code": "MODEL_ERROR",
                  "message": "Model refusal, invalid or truncated response after bounded attempts",
                  "issues": [],
                  "retryable": false
                }
              }
            }
          },
          "503": {
            "description": "Model unavailable and no fallback can produce a usable result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "code": "MODEL_UNAVAILABLE",
                  "message": "Model unavailable and no fallback can produce a usable result",
                  "issues": [],
                  "retryable": false
                }
              }
            }
          },
          "504": {
            "description": "Operation deadline exceeded",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "code": "DEADLINE_EXCEEDED",
                  "message": "Operation deadline exceeded",
                  "issues": [],
                  "retryable": false
                }
              }
            }
          }
        }
      }
    },
    "/v1/events/{event_id}": {
      "get": {
        "operationId": "getEvent",
        "summary": "Read current caller-owned event",
        "tags": [
          "Delivery"
        ],
        "parameters": [
          {
            "name": "event_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Current event; this does not accept a candidate.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventRecord"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "event_id": "11111111-1111-4111-8111-111111111111",
                  "version": 3,
                  "status": "confirmed",
                  "event": {
                    "title": "Встреча о тревоге у подростков",
                    "description": "Обсудим тревогу у подростков.",
                    "date_start": "2026-11-16",
                    "date_end": null,
                    "time_start": "15:00",
                    "venue": "Пространство «Точка», Пушкина 12",
                    "price": 2500,
                    "price_discount": 2000,
                    "registration": "Запись в личные сообщения эксперта"
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthenticated",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "code": "UNAUTHENTICATED",
                  "message": "Unauthenticated",
                  "issues": [],
                  "retryable": false
                }
              }
            }
          },
          "404": {
            "description": "Not found or not owned",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "request_id": "11111111-1111-4111-8111-111111111111",
                  "code": "NOT_FOUND",
                  "message": "Event/candidate not found or not owned by caller",
                  "issues": [],
                  "retryable": false
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Event": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "title": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 100
          },
          "description": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 2000
          },
          "date_start": {
            "type": [
              "string",
              "null"
            ],
            "format": "date"
          },
          "date_end": {
            "type": [
              "string",
              "null"
            ],
            "format": "date"
          },
          "time_start": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$"
          },
          "venue": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 500
          },
          "price": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0
          },
          "price_discount": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0
          },
          "registration": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 500
          }
        },
        "required": [
          "title",
          "description",
          "date_start",
          "date_end",
          "time_start",
          "venue",
          "price",
          "price_discount",
          "registration"
        ],
        "description": "All keys required; null means unknown. Confirmation requires non-null title, description, date_start, time_start, venue, price, registration. date_end/price_discount may remain null. No implicit city/year inference."
      },
      "Issue": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "MISSING_FIELD",
              "DATE_CONFLICT",
              "PAST_DATE",
              "INVALID_DATE",
              "END_BEFORE_START",
              "PRICE_CONFLICT",
              "INCOMPLETE_VENUE",
              "INVALID_PATCH",
              "EVIDENCE_MISMATCH",
              "CONTENT_REVIEW"
            ]
          },
          "field": {
            "type": [
              "string",
              "null"
            ]
          },
          "message": {
            "type": "string",
            "maxLength": 1000
          },
          "question": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 500
          },
          "evidence": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 1000
          },
          "blocking": {
            "type": "boolean"
          }
        },
        "required": [
          "code",
          "field",
          "message",
          "question",
          "evidence",
          "blocking"
        ]
      },
      "Change": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "field": {
            "type": "string",
            "enum": [
              "title",
              "description",
              "date_start",
              "date_end",
              "time_start",
              "venue",
              "price",
              "price_discount",
              "registration"
            ]
          },
          "operation": {
            "type": "string",
            "enum": [
              "set",
              "clear"
            ]
          },
          "value": {
            "type": [
              "string",
              "number",
              "null"
            ]
          },
          "evidence": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000
          }
        },
        "required": [
          "field",
          "operation",
          "value",
          "evidence"
        ],
        "description": "Server validates field-specific type, non-null set, null clear, explicit evidence and no duplicate fields. Omitted field is unchanged; clear of required fact prevents confirmation."
      },
      "Usage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "input_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "output_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "cost_usd": {
            "type": "number",
            "minimum": 0
          },
          "cost_rub": {
            "type": "number",
            "minimum": 0
          },
          "fx_rate": {
            "type": "number",
            "exclusiveMinimum": 0
          },
          "price_version": {
            "type": "string"
          },
          "cache_hit": {
            "type": "boolean"
          },
          "model_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "attempts": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "input_tokens",
          "output_tokens",
          "cost_usd",
          "cost_rub",
          "fx_rate",
          "price_version",
          "cache_hit",
          "model_ids",
          "attempts"
        ],
        "description": "Per HTTP operation, including billable retries. Unknown usage yields error/reconciliation, never fictitious zero. manual/template/cache have zero new model tokens."
      },
      "Candidate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "candidate_id": {
            "type": "string",
            "format": "uuid"
          },
          "base_version": {
            "type": "integer",
            "minimum": 1
          },
          "event": {
            "$ref": "#/components/schemas/Event"
          },
          "changes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Change"
            }
          },
          "issues": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Issue"
            }
          },
          "status": {
            "type": "string",
            "enum": [
              "needs_clarification",
              "awaiting_confirmation"
            ]
          }
        },
        "required": [
          "candidate_id",
          "base_version",
          "event",
          "changes",
          "issues",
          "status"
        ],
        "description": "Server-owned status. needs_clarification iff any issue is blocking. Initial extraction has changes=[]. Candidate expires after 24h; confirming expired candidate is 409."
      },
      "ExtractionRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "text": {
            "type": "string",
            "minLength": 1,
            "maxLength": 12000
          },
          "reference_date": {
            "type": "string",
            "format": "date"
          },
          "timezone": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100,
            "description": "Valid IANA zone, e.g. Europe/Moscow; checked by backend."
          }
        },
        "required": [
          "text",
          "reference_date",
          "timezone"
        ]
      },
      "ExtractionResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "event_id": {
            "type": "string",
            "format": "uuid"
          },
          "event_version": {
            "type": "integer",
            "const": 1
          },
          "mode": {
            "type": "string",
            "enum": [
              "standard",
              "economy",
              "manual"
            ]
          },
          "candidate": {
            "$ref": "#/components/schemas/Candidate"
          },
          "usage": {
            "$ref": "#/components/schemas/Usage"
          }
        },
        "required": [
          "request_id",
          "event_id",
          "event_version",
          "mode",
          "candidate",
          "usage"
        ],
        "description": "Creates owner-scoped draft v1, never publishes. manual returns a candidate with unknown facts/issues for UI editing."
      },
      "PatchRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "text": {
            "type": "string",
            "minLength": 1,
            "maxLength": 12000
          },
          "expected_version": {
            "type": "integer",
            "minimum": 1
          },
          "reference_date": {
            "type": "string",
            "format": "date"
          },
          "timezone": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          }
        },
        "required": [
          "text",
          "expected_version",
          "reference_date",
          "timezone"
        ]
      },
      "PatchResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "event_id": {
            "type": "string",
            "format": "uuid"
          },
          "mode": {
            "type": "string",
            "enum": [
              "standard",
              "economy",
              "manual"
            ]
          },
          "candidate": {
            "$ref": "#/components/schemas/Candidate"
          },
          "usage": {
            "$ref": "#/components/schemas/Usage"
          }
        },
        "required": [
          "request_id",
          "event_id",
          "mode",
          "candidate",
          "usage"
        ],
        "description": "Proposal only; confirmed event unchanged. Manual candidate carries blocking issues until corrected text is resubmitted."
      },
      "ConfirmRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "candidate_id": {
            "type": "string",
            "format": "uuid"
          },
          "expected_version": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "candidate_id",
          "expected_version"
        ]
      },
      "EventRecord": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "event_id": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "status": {
            "type": "string",
            "enum": [
              "draft",
              "confirmed"
            ]
          },
          "event": {
            "$ref": "#/components/schemas/Event"
          }
        },
        "required": [
          "request_id",
          "event_id",
          "version",
          "status",
          "event"
        ]
      },
      "GenerateRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "expected_version": {
            "type": "integer",
            "minimum": 1
          },
          "platforms": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "vk",
                "email",
                "site"
              ]
            },
            "minItems": 1,
            "maxItems": 3,
            "uniqueItems": true
          },
          "tone": {
            "type": "string",
            "maxLength": 500
          },
          "preferred_mode": {
            "type": "string",
            "enum": [
              "standard",
              "economy"
            ]
          }
        },
        "required": [
          "expected_version",
          "platforms",
          "tone",
          "preferred_mode"
        ],
        "description": "Server loads confirmed event. Client cannot supply arbitrary event to bypass confirmation. requested mode is a preference; actual mode returned."
      },
      "VkContent": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "platform": {
            "type": "string",
            "const": "vk"
          },
          "headline": {
            "type": "string",
            "maxLength": 100
          },
          "snippet": {
            "type": "string",
            "maxLength": 160
          },
          "body": {
            "type": "string",
            "maxLength": 5000
          }
        },
        "required": [
          "platform",
          "headline",
          "snippet",
          "body"
        ]
      },
      "EmailContent": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "platform": {
            "type": "string",
            "const": "email"
          },
          "subject": {
            "type": "string",
            "maxLength": 50
          },
          "preheader": {
            "type": "string",
            "maxLength": 100
          },
          "body": {
            "type": "string",
            "maxLength": 8000
          }
        },
        "required": [
          "platform",
          "subject",
          "preheader",
          "body"
        ]
      },
      "SiteContent": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "platform": {
            "type": "string",
            "const": "site"
          },
          "markdown": {
            "type": "string",
            "maxLength": 12000
          }
        },
        "required": [
          "platform",
          "markdown"
        ]
      },
      "GenerateResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "event_id": {
            "type": "string",
            "format": "uuid"
          },
          "event_version": {
            "type": "integer",
            "minimum": 1
          },
          "status": {
            "type": "string",
            "const": "draft_content"
          },
          "mode": {
            "type": "string",
            "enum": [
              "standard",
              "economy",
              "template"
            ]
          },
          "contents": {
            "type": "array",
            "items": {
              "oneOf": [
                {
                  "$ref": "#/components/schemas/VkContent"
                },
                {
                  "$ref": "#/components/schemas/EmailContent"
                },
                {
                  "$ref": "#/components/schemas/SiteContent"
                }
              ]
            },
            "minItems": 1,
            "maxItems": 3
          },
          "issues": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Issue"
            }
          },
          "usage": {
            "$ref": "#/components/schemas/Usage"
          }
        },
        "required": [
          "request_id",
          "event_id",
          "event_version",
          "status",
          "mode",
          "contents",
          "issues",
          "usage"
        ],
        "description": "Exactly one item for every requested platform, no extras/duplicates (backend invariant). Fields are final server-rendered drafts. Human review required; no publication."
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "code": {
            "type": "string",
            "enum": [
              "UNAUTHENTICATED",
              "NOT_FOUND",
              "CONFLICT",
              "PAYLOAD_TOO_LARGE",
              "VALIDATION_ERROR",
              "BUDGET_EXCEEDED",
              "RATE_LIMITED",
              "MODEL_ERROR",
              "MODEL_UNAVAILABLE",
              "DEADLINE_EXCEEDED"
            ]
          },
          "message": {
            "type": "string"
          },
          "issues": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Issue"
            }
          },
          "retryable": {
            "type": "boolean"
          }
        },
        "required": [
          "request_id",
          "code",
          "message",
          "issues",
          "retryable"
        ]
      }
    }
  }
}
