services:
  ollama:
    image: ollama/ollama:0.40.13
    profiles: ["ai"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "11435:11434"        # другой порт
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_KEEP_ALIVE: "0"
    volumes:
      - ollama_staging_data:/root/.ollama
    networks:
      - backend-net
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 10 &&
      ollama pull qwen2.5:1.5b &&
      wait
      "
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  db:
    image: postgres:16-alpine
    container_name: staging_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: event_platform
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: event_platform_staging    # другая БД
    ports:
      - "5433:5432"                          # другой порт
    volumes:
      - db_staging_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: staging_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_staging_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  extractor:
    build:
      context: ./services/extractor
      dockerfile: Dockerfile
    container_name: staging_extractor
    restart: unless-stopped
    ports:
      - "8011:8000"
    environment:
      DATABASE_URL: postgresql://event_platform:changeme@db:5432/event_platform_staging
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: qwen2.5:1.5b
    env_file:
      - path: .env.staging
        required: false
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  page-composer:
    build:
      context: ./services/page-composer
      dockerfile: Dockerfile
    container_name: staging_page_composer
    restart: unless-stopped
    ports:
      - "8012:8000"
    env_file:
      - path: .env.staging
        required: false
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  vk-publisher:
    build:
      context: ./services/vk-publisher
      dockerfile: Dockerfile
    container_name: staging_vk_publisher
    restart: unless-stopped
    ports:
      - "8013:8000"
    env_file:
      - path: .env.staging
        required: false
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  mailer:
    build:
      context: ./services/mailer
      dockerfile: Dockerfile
    container_name: staging_mailer
    restart: unless-stopped
    ports:
      - "8014:8000"
    env_file:
      - path: .env.staging
        required: false
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    image: nginx:alpine
    container_name: staging_api_gateway
    restart: unless-stopped
    ports:
      - "8015:80"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - extractor
      - page-composer
      - vk-publisher
      - mailer

  site:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: staging_site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8020:3000"
    environment:
      EXTRACTOR_URL: http://extractor:8000
      COMPOSER_URL: http://page-composer:8000
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - extractor
      - page-composer

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  db_staging_data:
  redis_staging_data:
  ollama_staging_data: