services:
  # === База данных ===
  db:
    image: postgres:16-alpine
    container_name: event_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-event_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-event_platform}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-event_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Redis (кеш и очередь) ===
  redis:
    image: redis:7-alpine
    container_name: event_platform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === API Gateway (Nginx) ===
  api-gateway:
    image: nginx:alpine
    container_name: event_platform_api_gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - extractor
      - page-composer
      - vk-publisher
      - mailer

  # === Extractor ===
  extractor:
    build:
      context: ./services/extractor
      dockerfile: Dockerfile
    container_name: event_platform_extractor
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://event_platform:changeme@db:5432/event_platform
    env_file:
      - path: .env
        required: false
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === VK Publisher ===
  vk-publisher:
    build:
      context: ./services/vk-publisher
      dockerfile: Dockerfile
    container_name: event_platform_vk_publisher
    ports:
      - "8003:8000"
    env_file:
      - path: .env
        required: false
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === Mailer ===
  mailer:
    build:
      context: ./services/mailer
      dockerfile: Dockerfile
    container_name: event_platform_mailer
    ports:
      - "8004:8000"
    env_file:
      - path: .env
        required: false
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === Page Composer ===
  page-composer:
    build:
      context: ./services/page-composer
      dockerfile: Dockerfile
    container_name: event_platform_page_composer
    ports:
      - "8002:8000"
    env_file:
      - path: .env
        required: false
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === Frontend (Next.js) ===
  site:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: event_platform_site
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_EXTRACTOR_URL: http://extractor:8000
      NEXT_PUBLIC_COMPOSER_URL: http://page-composer:8000
    networks:
      - frontend-net
    depends_on:
      - extractor
      - page-composer

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  db_data:
  redis_data: