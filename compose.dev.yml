name: event-platform
services:
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '2'
      OLLAMA_KEEP_ALIVE: '0'
    volumes:
    - ollama_data:/root/.ollama
    networks:
    - backend-net
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  db:
    image: postgres:16-alpine
    container_name: event_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-event_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-event_platform}
    ports:
    - 5432:5432
    volumes:
    - db_data:/var/lib/postgresql/data
    - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    networks:
    - backend-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-event_platform}
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: event_platform_redis
    restart: unless-stopped
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    networks:
    - backend-net
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
  api-gateway:
    image: nginx:alpine
    container_name: event_platform_api_gateway
    restart: unless-stopped
    ports:
    - 8000:80
    networks:
    - frontend-net
    - backend-net
    depends_on:
    - extractor
    - page-composer
    - vk-publisher
    - mailer
  extractor:
    build:
      context: ./services/extractor
      dockerfile: Dockerfile
    container_name: event_platform_extractor
    restart: unless-stopped
    ports:
    - 127.0.0.1:8001:8000
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      DATABASE_URL: ${DATABASE_URL:-postgresql://event_platform:changeme@db:5432/event_platform}
      LLM_ECONOMY_MODEL: ${LLM_ECONOMY_MODEL:-qwen2.5:0.5b}
      DAILY_REQUEST_LIMIT: ${DAILY_REQUEST_LIMIT:-100}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-200000}
      ECONOMY_REQUEST_LIMIT: ${ECONOMY_REQUEST_LIMIT:-20}
      ECONOMY_TOKEN_LIMIT: ${ECONOMY_TOKEN_LIMIT:-20000}
      EXTRACTOR_DEMO_TOKEN: ${EXTRACTOR_DEMO_TOKEN:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    env_file:
    - path: .env
      required: false
    networks:
    - backend-net
    depends_on:
      ollama:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  vk-publisher:
    build:
      context: ./services/vk-publisher
      dockerfile: Dockerfile
    container_name: event_platform_vk_publisher
    restart: unless-stopped
    ports:
    - 8003:8000
    env_file:
    - path: .env
      required: false
    networks:
    - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  mailer:
    build:
      context: ./services/mailer
      dockerfile: Dockerfile
    container_name: event_platform_mailer
    restart: unless-stopped
    ports:
    - 8004:8000
    env_file:
    - path: .env
      required: false
    networks:
    - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  page-composer:
    build:
      context: ./services/page-composer
      dockerfile: Dockerfile
    container_name: event_platform_page_composer
    restart: unless-stopped
    ports:
    - 8002:8000
    env_file:
    - path: .env
      required: false
    networks:
    - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  site:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: event_platform_site
    restart: unless-stopped
    ports:
    - 127.0.0.1:8010:3000
    environment:
      EXTRACTOR_URL: http://extractor:8000
      COMPOSER_URL: http://page-composer:8000
    networks:
    - frontend-net
    - backend-net
    depends_on:
    - extractor
    - page-composer
  prometheus:
    image: prom/prometheus:v2.51.0
    platform: linux/amd64
    container_name: event_platform_prometheus
    user: '65534'
    restart: unless-stopped
    volumes:
    - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    networks:
    - backend-net
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=3d
    ports:
    - 127.0.0.1:9090:9090
  loki:
    image: grafana/loki:2.9.6
    platform: linux/amd64
    container_name: event_platform_loki
    restart: unless-stopped
    volumes:
    - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    - loki_data:/loki
    networks:
    - backend-net
    command: -config.file=/etc/loki/local-config.yaml
  tempo:
    image: grafana/tempo:2.4.1
    platform: linux/amd64
    container_name: event_platform_tempo
    restart: unless-stopped
    volumes:
    - ./monitoring/tempo/tempo-config.yaml:/etc/tempo/config.yaml:ro
    - tempo_data:/tmp/tempo
    networks:
    - backend-net
    command: -config.file=/etc/tempo/config.yaml
  grafana:
    image: grafana/grafana:10.4.0
    platform: linux/amd64
    container_name: event_platform_grafana
    restart: unless-stopped
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - grafana_data:/var/lib/grafana
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    networks:
    - backend-net
    depends_on:
    - prometheus
    - loki
    - tempo
    ports:
    - 127.0.0.1:3002:3000
  alloy:
    image: grafana/alloy:v1.8.3
    platform: linux/amd64
    restart: unless-stopped
    user: 0:0
    environment:
      MONITORING_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-event-platform}
    networks:
    - backend-net
    command:
    - run
    - --storage.path=/var/lib/alloy
    - /etc/alloy/config.alloy
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
    - alloy_data:/var/lib/alloy
    depends_on:
    - loki
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
volumes:
  db_data: null
  redis_data: null
  ollama_data: null
  prometheus_data: null
  loki_data: null
  tempo_data: null
  grafana_data: null
  alloy_data: null
