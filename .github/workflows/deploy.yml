name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Этот джоб будет пропущен, если нет секретов (безопасно)
    if: github.repository == 'vstu-sii/sova-so-skakalkoy-zmct'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2223
          script: |
            cd /workspace/event-platform
            git pull origin main
            docker compose -f compose.dev.yml up -d --build