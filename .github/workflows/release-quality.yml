name: Release Quality

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to verify
        required: true
        default: v1.0.0-demo
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-gate:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /home/runner/.cache/sova-ollama-models
      OLLAMA_NUM_PARALLEL: '1'
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - run: pip install -r requirements-ai.txt
      - name: Candidate perimeter tests
        run: python -m pytest -q
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/sova-ollama-models
          key: ollama-qwen25-3b-lab3-v1
      - name: Install pinned Ollama and start loopback server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ollama"
          curl --fail --location --retry 3 https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
          nohup "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:11434/api/version; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Pull real local model
        run: ollama pull qwen2.5:3b
      - name: Verify exact baseline weights
        run: python -m tests.evals.verify_model
      - name: Full regression of the pinned release
        run: python -m tests.evals.release --tag "$RELEASE_TAG" --output release-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-quality-evidence
          path: release-results/
          retention-days: 30
