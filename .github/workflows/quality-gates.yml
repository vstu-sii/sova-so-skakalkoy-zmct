name: Quality Gates

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical:
    name: Critical paths and output boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - run: pip install -r requirements-ai.txt
      - run: python -m pytest -q

  full-evals:
    name: Full golden dataset shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen2.5:3b
      AI_CALL_TIMEOUT: '180'
      AI_DEADLINE: '365'
      AI_TRACE_CONTENT: 'false'
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /home/runner/.cache/sova-ollama-models
      OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - run: pip install -r requirements-ai.txt
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/sova-ollama-models
          key: ollama-v04013-qwen25-3b-357c53fb-linux-amd64
      - name: Install pinned Ollama and start loopback server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ollama"
          curl --fail --location --retry 3 https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
          nohup "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:11434/api/version; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Pull real local model
        run: ollama pull qwen2.5:3b
      - name: Verify exact baseline weights
        run: python -m tests.evals.verify_model
      - name: Run all cases in shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -m tests.evals.quality_gate split --index "$SHARD" --count 2 --output shard.jsonl
          python -m tests.evals.run --dataset shard.jsonl --split all --repeats 1 --output eval-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-shard-${{ matrix.shard }}
          path: eval-artifacts/
          retention-days: 14

  gate:
    name: Quality Gate
    if: always()
    needs: [critical, full-evals]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail if any dependency failed
        env:
          CRITICAL: ${{ needs.critical.result }}
          EVALS: ${{ needs.full-evals.result }}
        run: test "$CRITICAL" = success && test "$EVALS" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - run: pip install -r requirements-ai.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-shard-*
          path: quality-results
      - name: Enforce quality thresholds on complete results
        run: >-
          python -m tests.evals.quality_gate merge
          --results quality-results
          --thresholds tests/evals/quality-thresholds.json
          --output quality-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-report
          path: quality-report.json
          retention-days: 14
